<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MBA选课助手 - 2025-2026学年第二学期</title>
    <!-- 引入精选字体 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
    <style>
        /* ═══════════════════════════════════════════════════════════════════
           「墨韵学府」- 新文人商学风设计系统
           ═══════════════════════════════════════════════════════════════════ */

        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            /* 核心色彩 - 墨韵靛青 */
            --ink-900: #0f172a;
            --ink-800: #1e293b;
            --ink-700: #334155;
            --ink-600: #475569;
            --ink-500: #64748b;
            --ink-400: #94a3b8;
            --ink-300: #cbd5e1;
            --ink-200: #e2e8f0;
            --ink-100: #f1f5f9;

            /* 宣纸白 - 温暖的背景 */
            --paper: #faf9f7;
            --paper-warm: #f5f3ef;
            --paper-cream: #fffef9;

            /* 暖金点缀 */
            --gold: #b8860b;
            --gold-light: #d4a574;
            --gold-glow: rgba(184, 134, 11, 0.15);
            --gold-border: rgba(184, 134, 11, 0.3);

            /* 朱砂红 - 必选 */
            --vermilion: #c41e3a;
            --vermilion-light: #dc143c;
            --vermilion-bg: #fef2f2;

            /* 靛青蓝 - 想选 */
            --indigo: #1e3a5f;
            --indigo-light: #2563eb;
            --indigo-bg: #eff6ff;

            /* 墨灰 - 可选 */
            --slate: #64748b;
            --slate-light: #94a3b8;
            --slate-bg: #f8fafc;

            /* 翠绿 - 成功 */
            --jade: #166534;
            --jade-light: #22c55e;
            --jade-bg: #f0fdf4;

            /* 琥珀 - 警告 */
            --amber: #b45309;
            --amber-light: #f59e0b;

            /* 阴影系统 */
            --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(15, 23, 42, 0.08), 0 2px 4px -2px rgba(15, 23, 42, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(15, 23, 42, 0.1), 0 4px 6px -4px rgba(15, 23, 42, 0.1);
            --shadow-xl: 0 20px 25px -5px rgba(15, 23, 42, 0.1), 0 8px 10px -6px rgba(15, 23, 42, 0.1);
            --shadow-gold: 0 4px 14px rgba(184, 134, 11, 0.15);

            /* 过渡 */
            --transition-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
            --transition-base: 250ms cubic-bezier(0.4, 0, 0.2, 1);
            --transition-slow: 350ms cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* 全局背景 - 宣纸纹理 */
        body {
            font-family: 'Noto Serif SC', 'Source Serif 4', Georgia, serif;
            background: var(--paper);
            background-image:
                radial-gradient(ellipse at 20% 30%, rgba(184, 134, 11, 0.03) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 70%, rgba(30, 58, 95, 0.03) 0%, transparent 50%),
                url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            background-blend-mode: normal, normal, soft-light;
            color: var(--ink-800);
            line-height: 1.7;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* ═══════════════════════════════════════════════════════════════════
           Header - 匾额风格
           ═══════════════════════════════════════════════════════════════════ */
        header {
            background: linear-gradient(135deg, var(--ink-900) 0%, var(--ink-800) 50%, var(--ink-900) 100%);
            color: var(--paper-cream);
            padding: 20px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            position: relative;
            z-index: 100;
            border-bottom: 3px solid var(--gold);
        }

        /* 装饰性金边 */
        header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold-light), transparent);
        }

        header::after {
            content: '';
            position: absolute;
            bottom: 3px;
            left: 5%;
            right: 5%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
        }

        header h1 {
            font-family: 'ZCOOL XiaoWei', 'Noto Serif SC', serif;
            font-size: 1.75rem;
            font-weight: 400;
            letter-spacing: 0.15em;
            position: relative;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        /* 标题装饰 */
        header h1::before,
        header h1::after {
            content: '◆';
            font-size: 0.5em;
            color: var(--gold);
            margin: 0 12px;
            vertical-align: middle;
            opacity: 0.8;
        }

        /* 锐评按钮 */
        .review-btn {
            background: linear-gradient(135deg, var(--vermilion) 0%, #a01830 100%);
            color: var(--paper-cream);
            border: 1px solid rgba(255,255,255,0.2);
            padding: 8px 20px;
            font-family: 'Noto Serif SC', serif;
            font-size: 0.9rem;
            letter-spacing: 0.1em;
            border-radius: 4px;
            cursor: pointer;
            transition: all var(--transition-base);
            box-shadow: 0 2px 8px rgba(196, 30, 58, 0.3);
        }

        .review-btn:hover {
            background: linear-gradient(135deg, var(--vermilion-light) 0%, var(--vermilion) 100%);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(196, 30, 58, 0.4);
        }

        .review-btn.unlocked {
            background: linear-gradient(135deg, var(--jade) 0%, #0d4a22 100%);
            box-shadow: 0 2px 8px rgba(22, 101, 52, 0.3);
        }

        .review-btn.unlocked:hover {
            background: linear-gradient(135deg, var(--jade-light) 0%, var(--jade) 100%);
            box-shadow: 0 4px 12px rgba(22, 101, 52, 0.4);
        }

        /* 导出按钮 */
        .export-btn {
            background: linear-gradient(135deg, var(--indigo) 0%, #1e3a5f 100%);
            color: var(--paper-cream);
            border: 1px solid rgba(255,255,255,0.2);
            padding: 8px 20px;
            font-family: 'Noto Serif SC', serif;
            font-size: 0.9rem;
            letter-spacing: 0.1em;
            border-radius: 4px;
            cursor: pointer;
            transition: all var(--transition-base);
            box-shadow: 0 2px 8px rgba(30, 58, 95, 0.3);
        }

        .export-btn:hover {
            background: linear-gradient(135deg, #3d5a80 0%, var(--indigo) 100%);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(30, 58, 95, 0.4);
        }

        .export-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* 导出菜单容器 */
        .export-menu-wrapper {
            position: relative;
            display: inline-block;
        }

        /* 导出下拉菜单 */
        .export-menu {
            display: none;
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            min-width: 180px;
            background: var(--paper-cream);
            border: 1px solid var(--ink-200);
            border-radius: 8px;
            box-shadow: var(--shadow-lg);
            z-index: 1000;
            overflow: hidden;
            animation: menuFadeIn 0.15s ease-out;
        }

        .export-menu.active {
            display: block;
        }

        @keyframes menuFadeIn {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .export-menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: none;
            border: none;
            width: 100%;
            text-align: left;
            font-family: 'Noto Serif SC', serif;
            font-size: 0.9rem;
            color: var(--ink-700);
            cursor: pointer;
            transition: var(--transition-fast);
        }

        .export-menu-item:hover {
            background: var(--gold-glow);
            color: var(--ink-900);
        }

        .export-menu-item:not(:last-child) {
            border-bottom: 1px solid var(--ink-100);
        }

        .export-menu-item .icon {
            font-size: 1.1rem;
        }

        .header-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        /* Toast 提示 */
        .toast {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: linear-gradient(135deg, var(--ink-800) 0%, var(--ink-900) 100%);
            color: var(--paper-cream);
            padding: 12px 24px;
            border-radius: 8px;
            font-family: 'Noto Serif SC', serif;
            font-size: 0.9rem;
            letter-spacing: 0.05em;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            border: 1px solid var(--gold-border);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 10000;
        }

        .toast.show {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }

        .toast.success {
            border-color: var(--jade);
        }

        .toast.error {
            border-color: var(--vermilion);
        }

        .toast.warning {
            border-color: var(--amber);
            background: linear-gradient(135deg, #92400e 0%, #78350f 100%);
        }

        .stats {
            display: flex;
            gap: 32px;
            flex-wrap: wrap;
        }

        .stat {
            text-align: center;
            position: relative;
            padding: 8px 16px;
        }

        .stat::after {
            content: '';
            position: absolute;
            right: -16px;
            top: 50%;
            transform: translateY(-50%);
            width: 1px;
            height: 60%;
            background: linear-gradient(to bottom, transparent, var(--gold-border), transparent);
        }

        .stat:last-child::after {
            display: none;
        }

        .stat .value {
            font-family: 'Source Serif 4', Georgia, serif;
            font-size: 1.75rem;
            font-weight: 600;
            color: var(--gold-light);
            line-height: 1.2;
            text-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }

        .stat .label {
            font-size: 0.75rem;
            opacity: 0.8;
            letter-spacing: 0.05em;
            margin-top: 4px;
        }

        .stat.danger .value {
            color: #fca5a5;
            animation: pulse-warning 2s ease-in-out infinite;
        }

        @keyframes pulse-warning {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        /* ═══════════════════════════════════════════════════════════════════
           Main Layout - 三栏书卷式布局
           ═══════════════════════════════════════════════════════════════════ */
        .main-container {
            display: grid;
            grid-template-columns: 1fr 360px 1fr;
            gap: 20px;
            padding: 20px;
            height: calc(100vh - 100px);
            max-width: 1800px;
            margin: 0 auto;
        }

        @media (max-width: 1400px) { .main-container { grid-template-columns: 1fr 320px 1fr; gap: 16px; } }
        @media (max-width: 1100px) { .main-container { grid-template-columns: 1fr 1fr; } }
        @media (max-width: 700px) { .main-container { grid-template-columns: 1fr; } }

        /* ═══════════════════════════════════════════════════════════════════
           Panel - 卷轴风格面板
           ═══════════════════════════════════════════════════════════════════ */
        .panel {
            background: var(--paper-cream);
            border-radius: 4px;
            box-shadow: var(--shadow-lg);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            border: 1px solid var(--ink-200);
        }

        /* 面板顶部装饰线 */
        .panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--gold), var(--gold-light), var(--gold));
        }

        .panel-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--ink-200);
            font-weight: 600;
            font-size: 1rem;
            color: var(--ink-700);
            flex-shrink: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(to bottom, var(--paper-cream), var(--paper-warm));
            letter-spacing: 0.05em;
        }

        .panel-header::before {
            content: '『';
            color: var(--gold);
            margin-right: 8px;
            font-weight: 400;
        }

        .panel-header::after {
            content: '』';
            color: var(--gold);
            margin-left: auto;
            font-weight: 400;
        }

        .panel-body {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            background: var(--paper-cream);
        }

        /* 自定义滚动条 */
        .panel-body::-webkit-scrollbar {
            width: 8px;
        }

        .panel-body::-webkit-scrollbar-track {
            background: var(--ink-100);
            border-radius: 4px;
        }

        .panel-body::-webkit-scrollbar-thumb {
            background: var(--ink-300);
            border-radius: 4px;
            border: 2px solid var(--ink-100);
        }

        .panel-body::-webkit-scrollbar-thumb:hover {
            background: var(--ink-400);
        }

        /* ═══════════════════════════════════════════════════════════════════
           搜索框 - 砚台风格
           ═══════════════════════════════════════════════════════════════════ */
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }

        .search-box input {
            flex: 1;
            padding: 10px 16px;
            border: 1px solid var(--ink-200);
            border-radius: 4px;
            font-size: 0.9rem;
            font-family: inherit;
            background: white;
            color: var(--ink-700);
            transition: var(--transition-base);
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 0 3px var(--gold-glow);
        }

        .search-box input::placeholder {
            color: var(--ink-400);
        }

        .search-box select {
            padding: 10px 12px;
            border: 1px solid var(--ink-200);
            border-radius: 4px;
            font-size: 0.9rem;
            font-family: inherit;
            background: white;
            color: var(--ink-700);
            cursor: pointer;
            transition: var(--transition-base);
        }

        .search-box select:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 0 3px var(--gold-glow);
        }

        /* ═══════════════════════════════════════════════════════════════════
           标签筛选 - 印章风格
           ═══════════════════════════════════════════════════════════════════ */
        .filter-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
            padding-bottom: 16px;
            border-bottom: 1px dashed var(--ink-200);
        }

        .filter-tag {
            padding: 6px 14px;
            border-radius: 2px;
            font-size: 0.8rem;
            border: 1px solid var(--ink-300);
            background: white;
            cursor: pointer;
            transition: var(--transition-base);
            white-space: nowrap;
            position: relative;
            letter-spacing: 0.03em;
        }

        .filter-tag:hover {
            border-color: var(--gold);
            background: var(--gold-glow);
            transform: translateY(-1px);
        }

        .filter-tag.active {
            background: var(--ink-800);
            color: var(--gold-light);
            border-color: var(--ink-800);
            box-shadow: var(--shadow-md);
        }

        .filter-tag.active::before {
            content: '';
            position: absolute;
            top: -1px;
            left: -1px;
            right: -1px;
            bottom: -1px;
            border: 1px solid var(--gold);
            border-radius: 2px;
            pointer-events: none;
        }

        .filter-tag.separator {
            background: none;
            border: none;
            padding: 6px 4px;
            cursor: default;
            color: var(--ink-300);
            font-weight: 300;
        }

        .filter-tag.separator:hover {
            background: none;
            transform: none;
        }

        /* ═══════════════════════════════════════════════════════════════════
           课程卡片 - 书简风格
           ═══════════════════════════════════════════════════════════════════ */
        .course-card {
            padding: 14px 16px;
            border: 1px solid var(--ink-200);
            border-radius: 4px;
            margin-bottom: 10px;
            cursor: grab;
            transition: var(--transition-base);
            background: white;
            position: relative;
            overflow: hidden;
        }

        /* 左侧装饰线 */
        .course-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 3px;
            background: var(--ink-300);
            transition: var(--transition-base);
        }

        .course-card:hover {
            border-color: var(--gold);
            box-shadow: var(--shadow-gold);
            transform: translateY(-2px);
        }

        .course-card:hover::before {
            background: var(--gold);
        }

        .course-card.dragging {
            opacity: 0.6;
            transform: rotate(2deg) scale(1.02);
            box-shadow: var(--shadow-xl);
        }

        .course-card .name {
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 8px;
            color: var(--ink-800);
            line-height: 1.4;
        }

        .course-card .name span:first-child {
            flex: 1;
        }

        .course-card .info {
            font-size: 0.8rem;
            color: var(--ink-500);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .course-card .info::before {
            content: '◇';
            font-size: 0.6em;
            color: var(--gold);
        }

        .course-card .conflict-warn {
            font-size: 0.8rem;
            color: var(--vermilion);
            margin-top: 8px;
            padding: 6px 10px;
            background: var(--vermilion-bg);
            border-radius: 3px;
            border-left: 2px solid var(--vermilion);
        }

        /* 课程额外信息 - 考核方式和备注 */
        .course-card .course-extras {
            margin-top: 8px;
            font-size: 0.75rem;
            line-height: 1.5;
        }

        .course-card .assessment {
            color: var(--ink-600);
            padding: 4px 8px;
            background: var(--paper-warm);
            border-radius: 3px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .course-card .assessment::before {
            content: '考核';
            font-weight: 600;
            color: var(--indigo);
            font-size: 0.7rem;
        }

        .course-card .notes {
            margin-top: 6px;
            color: var(--amber);
            padding: 4px 8px;
            background: linear-gradient(135deg, #fffbeb, #fef3c7);
            border-radius: 3px;
            border-left: 2px solid var(--amber-light);
            display: flex;
            align-items: flex-start;
            gap: 4px;
        }

        .course-card .notes::before {
            content: '📌';
            font-size: 0.8em;
            flex-shrink: 0;
        }

        /* 徽章样式 */
        .badge {
            font-size: 0.7rem;
            padding: 3px 8px;
            border-radius: 2px;
            font-weight: 500;
            white-space: nowrap;
            letter-spacing: 0.02em;
        }

        .badge.online {
            background: var(--indigo-bg);
            color: var(--indigo);
            border: 1px solid rgba(30, 58, 95, 0.2);
        }

        .badge.credits {
            background: linear-gradient(135deg, #fef3c7, #fde68a);
            color: var(--amber);
            border: 1px solid rgba(180, 83, 9, 0.2);
        }

        /* ═══════════════════════════════════════════════════════════════════
           优先级栏 - 三段折叠屏风
           ═══════════════════════════════════════════════════════════════════ */
        .priority-columns {
            display: flex;
            flex-direction: column;
            gap: 12px;
            height: 100%;
        }

        .priority-col {
            flex: 1;
            background: var(--paper-cream);
            border-radius: 4px;
            box-shadow: var(--shadow-md);
            display: flex;
            flex-direction: column;
            min-height: 100px;
            border: 1px solid var(--ink-200);
            overflow: hidden;
            position: relative;
        }

        .priority-header {
            padding: 12px 16px;
            border-bottom: 2px solid;
            font-weight: 600;
            font-size: 0.9rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            letter-spacing: 0.05em;
        }

        .priority-header .coin-hint {
            font-size: 0.75rem;
            font-weight: 500;
            opacity: 0.8;
        }

        /* 必选 - 朱砂红 */
        .priority-col.must .priority-header {
            border-color: var(--vermilion);
            color: var(--vermilion);
            background: linear-gradient(to bottom, var(--vermilion-bg), rgba(254, 242, 242, 0.5));
        }

        .priority-col.must .priority-header::before {
            content: '壹';
            font-family: 'ZCOOL XiaoWei', serif;
            margin-right: 8px;
            opacity: 0.6;
        }

        /* 想选 - 靛青蓝 */
        .priority-col.want .priority-header {
            border-color: var(--indigo);
            color: var(--indigo);
            background: linear-gradient(to bottom, var(--indigo-bg), rgba(239, 246, 255, 0.5));
        }

        .priority-col.want .priority-header::before {
            content: '贰';
            font-family: 'ZCOOL XiaoWei', serif;
            margin-right: 8px;
            opacity: 0.6;
        }

        /* 可选 - 墨灰 */
        .priority-col.optional .priority-header {
            border-color: var(--slate);
            color: var(--slate);
            background: linear-gradient(to bottom, var(--slate-bg), rgba(248, 250, 252, 0.5));
        }

        .priority-col.optional .priority-header::before {
            content: '叁';
            font-family: 'ZCOOL XiaoWei', serif;
            margin-right: 8px;
            opacity: 0.6;
        }

        .priority-body {
            flex: 1;
            padding: 12px;
            overflow-y: auto;
            min-height: 60px;
            transition: var(--transition-base);
            background: var(--paper-cream);
        }

        .priority-body.drag-over {
            background: var(--jade-bg);
            border: 2px dashed var(--jade);
            border-radius: 0 0 4px 4px;
        }

        .priority-body .empty-hint {
            color: var(--ink-400);
            font-size: 0.85rem;
            text-align: center;
            padding: 20px 12px;
            font-style: italic;
        }

        /* 优先级栏内的课程卡片 */
        .priority-body .course-card::before {
            width: 4px;
        }

        .priority-col.must .course-card::before { background: var(--vermilion); }
        .priority-col.want .course-card::before { background: var(--indigo); }
        .priority-col.optional .course-card::before { background: var(--slate); }

        /* ═══════════════════════════════════════════════════════════════════
           金币分配输入
           ═══════════════════════════════════════════════════════════════════ */
        .coin-input-wrap {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px dashed var(--ink-200);
        }

        .coin-input-wrap input {
            width: 60px;
            padding: 4px 8px;
            border: 1px solid var(--ink-300);
            border-radius: 3px;
            font-size: 0.85rem;
            font-family: 'Source Serif 4', serif;
            text-align: right;
            color: var(--ink-700);
            transition: var(--transition-base);
        }

        .coin-input-wrap input:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 0 2px var(--gold-glow);
        }

        .coin-input-wrap span {
            font-size: 0.8rem;
            color: var(--ink-500);
        }

        .coin-input-wrap .suggested {
            font-size: 0.75rem;
            color: var(--gold);
            margin-left: auto;
            font-weight: 500;
        }

        /* 中标概率显示 */
        .coin-input-wrap .win-prob {
            font-size: 0.7rem;
            margin-left: auto;
            font-weight: 600;
            padding: 2px 6px;
            border-radius: 3px;
            white-space: nowrap;
        }

        .win-prob.prob-low {
            color: var(--jade);
            background: #ecfdf5;
        }

        .win-prob.prob-medium {
            color: var(--amber);
            background: #fffbeb;
        }

        .win-prob.prob-high {
            color: var(--vermilion);
            background: #fef2f2;
        }

        /* ═══════════════════════════════════════════════════════════════════
           金币统计与策略提示
           ═══════════════════════════════════════════════════════════════════ */
        .coin-summary {
            padding: 12px 16px;
            background: var(--paper-warm);
            border-top: 1px solid var(--ink-200);
            font-size: 0.9rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .coin-summary.over {
            background: var(--vermilion-bg);
            color: var(--vermilion);
            border-top-color: var(--vermilion);
        }

        .auto-btn {
            padding: 6px 14px;
            font-size: 0.8rem;
            font-family: inherit;
            background: var(--ink-800);
            color: var(--gold-light);
            border: none;
            border-radius: 3px;
            cursor: pointer;
            transition: var(--transition-base);
            letter-spacing: 0.05em;
        }

        .auto-btn:hover {
            background: var(--ink-700);
            box-shadow: var(--shadow-md);
            transform: translateY(-1px);
        }

        /* 策略选择器 */
        .strategy-selector {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            background: var(--paper-warm);
            border-top: 1px solid var(--ink-200);
            flex-shrink: 0;
        }

        .strategy-label {
            font-size: 0.75rem;
            color: var(--ink-500);
            font-weight: 500;
        }

        .strategy-btn {
            padding: 4px 10px;
            border: 1px solid var(--ink-300);
            border-radius: 4px;
            background: var(--paper);
            color: var(--ink-600);
            font-size: 0.7rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .strategy-btn:hover {
            border-color: var(--gold);
            background: var(--gold-light);
        }

        .strategy-btn.active {
            background: linear-gradient(135deg, var(--gold), #d4a843);
            border-color: var(--gold);
            color: white;
            font-weight: 500;
            box-shadow: 0 1px 3px rgba(196, 161, 59, 0.3);
        }

        .strategy-btn[data-strategy="conservative"] {
            border-color: var(--jade);
        }
        .strategy-btn[data-strategy="conservative"].active {
            background: linear-gradient(135deg, var(--jade), #2d8a5e);
        }
        .strategy-btn[data-strategy="conservative"]:hover:not(.active) {
            background: #ecfdf5;
        }

        .strategy-btn[data-strategy="aggressive"] {
            border-color: var(--vermilion);
        }
        .strategy-btn[data-strategy="aggressive"].active {
            background: linear-gradient(135deg, var(--vermilion), #c24a3a);
        }
        .strategy-btn[data-strategy="aggressive"]:hover:not(.active) {
            background: #fef2f2;
        }

        .strategy-hint {
            padding: 10px 14px;
            background: linear-gradient(to right, #fffbeb, #fef3c7);
            border-top: 1px solid var(--gold-border);
            font-size: 0.8rem;
            color: var(--amber);
            flex-shrink: 0;
            line-height: 1.5;
        }

        .strategy-hint strong {
            color: var(--gold);
        }

        /* ═══════════════════════════════════════════════════════════════════
           移除按钮
           ═══════════════════════════════════════════════════════════════════ */
        .remove-btn {
            background: none;
            border: none;
            color: var(--ink-400);
            cursor: pointer;
            font-size: 1.1rem;
            padding: 2px 8px;
            border-radius: 3px;
            transition: var(--transition-base);
            line-height: 1;
        }

        .remove-btn:hover {
            background: var(--vermilion-bg);
            color: var(--vermilion);
        }

        /* ═══════════════════════════════════════════════════════════════════
           日历 - 黄历风格
           ═══════════════════════════════════════════════════════════════════ */
        .calendar-scroll {
            flex: 1;
            overflow-y: auto;
        }

        .month-section {
            margin-bottom: 24px;
        }

        .month-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--ink-700);
            margin-bottom: 12px;
            padding: 10px 14px;
            background: linear-gradient(to right, var(--ink-800), var(--ink-700));
            color: var(--gold-light);
            border-radius: 3px;
            position: sticky;
            top: 0;
            z-index: 10;
            letter-spacing: 0.1em;
            box-shadow: var(--shadow-md);
        }

        .month-title::before {
            content: '◈';
            margin-right: 10px;
            font-size: 0.8em;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }

        .calendar-header {
            text-align: center;
            font-weight: 600;
            font-size: 0.75rem;
            color: var(--ink-600);
            padding: 8px 0;
            background: var(--paper-warm);
            border-radius: 2px;
        }

        .calendar-day {
            min-height: 70px;
            padding: 6px;
            border: 1px solid var(--ink-200);
            border-radius: 3px;
            font-size: 0.75rem;
            background: white;
            transition: var(--transition-base);
        }

        .calendar-day:hover {
            border-color: var(--gold-border);
            box-shadow: var(--shadow-sm);
        }

        .calendar-day.other-month {
            background: var(--ink-100);
            opacity: 0.4;
        }

        .calendar-day.has-course {
            background: linear-gradient(135deg, var(--jade-bg), #ecfdf5);
            border-color: rgba(22, 101, 52, 0.2);
        }

        .calendar-day .day-number {
            font-weight: 700;
            margin-bottom: 4px;
            font-size: 0.85rem;
            color: var(--ink-700);
            font-family: 'Source Serif 4', serif;
        }

        .calendar-day .event {
            padding: 2px 4px;
            margin-bottom: 2px;
            border-radius: 2px;
            font-size: 0.65rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .calendar-day .event.no-conflict {
            background: #d1fae5;
            color: var(--jade);
        }

        .calendar-day .event.conflict {
            background: #fee2e2;
            color: var(--vermilion);
            animation: conflict-flash 1.5s ease-in-out infinite;
        }

        @keyframes conflict-flash {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .calendar-day .event.must { border-left: 3px solid var(--vermilion); }
        .calendar-day .event.want { border-left: 3px solid var(--indigo); }
        .calendar-day .event.optional { border-left: 3px solid var(--slate); }

        /* ═══════════════════════════════════════════════════════════════════
           冲突高亮样式
           ═══════════════════════════════════════════════════════════════════ */
        .course-card.conflict-highlight {
            border-color: var(--vermilion) !important;
            background: var(--vermilion-bg) !important;
            animation: conflict-pulse 0.8s ease-in-out infinite;
            z-index: 10;
        }

        .course-card.conflict-highlight::before {
            background: var(--vermilion) !important;
        }

        .course-card.conflict-source {
            border-color: var(--amber-light) !important;
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.2);
        }

        @keyframes conflict-pulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(196, 30, 58, 0.3); }
            50% { transform: scale(1.01); box-shadow: 0 0 0 6px rgba(196, 30, 58, 0); }
        }

        .calendar-day.conflict-highlight {
            background: var(--vermilion-bg) !important;
            border-color: var(--vermilion) !important;
        }

        /* ═══════════════════════════════════════════════════════════════════
           移动端底部导航
           ═══════════════════════════════════════════════════════════════════ */
        .bottom-nav {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 64px;
            background: var(--ink-900);
            border-top: 2px solid var(--gold);
            justify-content: space-around;
            align-items: center;
            z-index: 100;
            box-shadow: 0 -4px 20px rgba(15, 23, 42, 0.2);
        }

        .bottom-nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 10px 20px;
            color: var(--ink-400);
            font-size: 0.75rem;
            cursor: pointer;
            position: relative;
            transition: var(--transition-base);
            letter-spacing: 0.05em;
        }

        .bottom-nav-item:hover {
            color: var(--ink-200);
        }

        .bottom-nav-item.active {
            color: var(--gold-light);
        }

        .bottom-nav-item .icon {
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bottom-nav-item .icon svg {
            width: 24px;
            height: 24px;
            stroke: currentColor;
            stroke-width: 1.5;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .bottom-nav-item .nav-badge {
            position: absolute;
            top: 4px;
            right: 12px;
            background: var(--vermilion);
            color: white;
            font-size: 0.65rem;
            padding: 2px 6px;
            border-radius: 10px;
            min-width: 18px;
            text-align: center;
            font-weight: 600;
        }

        /* ═══════════════════════════════════════════════════════════════════
           移动端响应式
           ═══════════════════════════════════════════════════════════════════ */
        @media (max-width: 700px) {
            .main-container {
                grid-template-columns: 1fr;
                padding: 12px;
                padding-bottom: 80px;
                height: auto;
                min-height: calc(100vh - 100px);
            }

            .panel, .priority-columns {
                display: none;
                min-height: calc(100vh - 180px);
            }

            .panel.mobile-active, .priority-columns.mobile-active {
                display: flex;
            }

            .bottom-nav {
                display: flex;
            }

            header {
                padding: 16px 20px;
            }

            header h1 {
                font-size: 1.3rem;
            }

            header h1::before,
            header h1::after {
                display: none;
            }

            .stats {
                gap: 20px;
            }

            .stat {
                padding: 4px 8px;
            }

            .stat .value {
                font-size: 1.3rem;
            }

            .stat .label {
                font-size: 0.65rem;
            }

            .stat::after {
                right: -10px;
            }

            .priority-columns.mobile-active {
                flex-direction: column;
                gap: 12px;
                padding: 0;
            }

            .priority-col {
                min-height: 140px;
            }

            .calendar-day {
                min-height: 55px;
                font-size: 0.7rem;
            }

            .calendar-day .day-number {
                font-size: 0.8rem;
            }

            .calendar-day .event {
                font-size: 0.6rem;
            }
        }

        /* ═══════════════════════════════════════════════════════════════════
           优雅的加载动画
           ═══════════════════════════════════════════════════════════════════ */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .panel, .priority-col {
            animation: fadeInUp 0.5s ease-out;
        }

        .priority-col:nth-child(1) { animation-delay: 0.1s; }
        .priority-col:nth-child(2) { animation-delay: 0.2s; }
        .priority-col:nth-child(3) { animation-delay: 0.3s; }

        /* ═══════════════════════════════════════════════════════════════════
           移动端Action Sheet 选择弹窗
           ═══════════════════════════════════════════════════════════════════ */
        .mobile-action-sheet {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 1000;
        }

        .mobile-action-sheet.active {
            display: block;
        }

        .action-sheet-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(4px);
            animation: fadeIn 0.2s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .action-sheet-content {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--paper);
            border-radius: 20px 20px 0 0;
            padding: 20px;
            padding-bottom: calc(20px + env(safe-area-inset-bottom, 0));
            animation: slideUp 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 -10px 40px rgba(15, 23, 42, 0.3);
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .action-sheet-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--ink-200);
            margin-bottom: 16px;
        }

        .action-sheet-title {
            font-family: 'ZCOOL XiaoWei', 'Noto Serif SC', serif;
            font-size: 1.2rem;
            color: var(--ink-800);
            letter-spacing: 0.1em;
        }

        .action-sheet-close {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: none;
            background: var(--ink-100);
            color: var(--ink-600);
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition-fast);
        }

        .action-sheet-close:hover {
            background: var(--ink-200);
            color: var(--ink-800);
        }

        .action-sheet-course {
            background: var(--paper-warm);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
            border-left: 4px solid var(--gold);
        }

        .action-sheet-course .course-name {
            font-weight: 600;
            color: var(--ink-800);
            margin-bottom: 8px;
            font-size: 1rem;
        }

        .action-sheet-course .course-info {
            display: flex;
            gap: 16px;
            font-size: 0.85rem;
            color: var(--ink-500);
        }

        .action-sheet-options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 16px;
        }

        .action-option {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px 20px;
            border-radius: 12px;
            border: 2px solid var(--ink-200);
            background: white;
            cursor: pointer;
            transition: var(--transition-base);
        }

        .action-option:active {
            transform: scale(0.98);
        }

        .action-option .option-icon {
            font-family: 'ZCOOL XiaoWei', serif;
            font-size: 1.5rem;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .action-option .option-text {
            font-weight: 600;
            font-size: 1rem;
            flex-grow: 1;
        }

        .action-option .option-hint {
            font-size: 0.8rem;
            color: var(--ink-400);
        }

        /* 必选按钮样式 */
        .action-option.must {
            border-color: var(--vermilion-light);
        }

        .action-option.must:hover,
        .action-option.must:active {
            background: var(--vermilion-bg);
            border-color: var(--vermilion);
        }

        .action-option.must .option-icon {
            background: var(--vermilion-bg);
            color: var(--vermilion);
        }

        .action-option.must .option-text {
            color: var(--vermilion);
        }

        /* 想选按钮样式 */
        .action-option.want {
            border-color: var(--indigo-light);
        }

        .action-option.want:hover,
        .action-option.want:active {
            background: var(--indigo-bg);
            border-color: var(--indigo);
        }

        .action-option.want .option-icon {
            background: var(--indigo-bg);
            color: var(--indigo);
        }

        .action-option.want .option-text {
            color: var(--indigo);
        }

        /* 可选按钮样式 */
        .action-option.optional {
            border-color: var(--slate-light);
        }

        .action-option.optional:hover,
        .action-option.optional:active {
            background: var(--slate-bg);
            border-color: var(--slate);
        }

        .action-option.optional .option-icon {
            background: var(--slate-bg);
            color: var(--slate);
        }

        .action-option.optional .option-text {
            color: var(--slate);
        }

        .action-cancel {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            border: none;
            background: var(--ink-100);
            color: var(--ink-600);
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition-base);
        }

        .action-cancel:hover {
            background: var(--ink-200);
        }

        /* 移动端课程卡片可点击样式 */
        @media (max-width: 700px) {
            .course-list .course-card:not(.selected) {
                cursor: pointer;
            }

            .course-list .course-card:not(.selected):active {
                transform: scale(0.98);
                background: var(--paper-warm);
            }
        }
    </style>
</head>
<body>
    <div class="toast" id="toast"></div>
    <header>
        <h1>MBA选课助手</h1>
        <div class="header-actions">
            <button class="review-btn" id="reviewBtn" onclick="toggleReview()">开启锐评</button>
            <div class="export-menu-wrapper">
                <button class="export-btn" id="exportBtn" onclick="toggleExportMenu(event)">导出方案</button>
                <div class="export-menu" id="exportMenu">
                    <button class="export-menu-item" onclick="copyPlanText()">
                        <span class="icon">📋</span>
                        <span>复制文本</span>
                    </button>
                    <button class="export-menu-item" onclick="exportToICS()">
                        <span class="icon">📅</span>
                        <span>导出日历文件</span>
                    </button>
                </div>
            </div>
        </div>
        <div class="stats">
            <div class="stat">
                <div class="value" id="totalCredits">0</div>
                <div class="label">已选学分</div>
            </div>
            <div class="stat">
                <div class="value" id="selectedCount">0</div>
                <div class="label">已选课程</div>
            </div>
            <div class="stat" id="conflictStat">
                <div class="value" id="conflictCount">0</div>
                <div class="label">时间冲突</div>
            </div>
            <div class="stat">
                <div class="value" id="remainingCoins">1000</div>
                <div class="label">剩余金币</div>
            </div>
        </div>
    </header>

    <div class="main-container">
        <!-- 左侧：课程列表 -->
        <div class="panel mobile-active" id="panelCourses">
            <div class="panel-header">全部课程 (71门)</div>
            <div class="panel-body">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="搜索课程名称...">
                    <select id="monthFilter">
                        <option value="">全部月份</option>
                        <option value="03">3月</option>
                        <option value="04">4月</option>
                        <option value="05">5月</option>
                        <option value="06">6月</option>
                        <option value="07">7月</option>
                        <option value="08">8月</option>

/**
 * 博弈论金币分配算法
 * 核心思想：基于课程热度和竞争环境，计算近似纳什均衡分配
 */

// 1. 课程热度评估函数
function estimateCoursePopularity(courseId) {
    const course = courses.find(c => c.id === courseId);
    if (!course) return 1.0;

    let popularity = 1.0;
    const extras = courseExtras[courseId] || {};
    const tag = getCourseTag(course);

    // 1.1 基于课程类型的热度
    const tagPopularity = {
        'culture': 1.4,      // 文化休闲类最热门
        'ai': 1.3,           // AI/科技类热门
        'finance': 1.2,      // 金融类较热门
        'leadership': 1.15,  // 领导力类较热门
        'marketing': 1.1,    // 营销类一般
        'strategy': 1.05,    // 战略类一般
        'other': 1.0
    };
    popularity *= tagPopularity[tag] || 1.0;

    // 1.2 限额课程更热门
    if (extras.notes) {
        if (extras.notes.includes('限额')) popularity *= 1.5;
        // 特殊体验课更热门
        if (extras.notes.includes('赛艇') || extras.notes.includes('品酒')) popularity *= 1.3;
    }

    // 1.3 考核难度影响（简单的更受欢迎）
    if (extras.assessment) {
        // 只有论文/小作文的课程更受欢迎
        if (extras.assessment.includes('论文') && !extras.assessment.includes('考试')) {
            popularity *= 1.15;
        }
        // 有考试且占比高的稍不受欢迎
        const examMatch = extras.assessment.match(/考试(\d+)/);
        if (examMatch && parseInt(examMatch[1]) >= 60) {
            popularity *= 0.95;
        }
    }

    // 1.4 2学分课程更受欢迎
    if (course.credits >= 2) popularity *= 1.25;

    // 1.5 线上课程稍低热度
    if (course.is_online) popularity *= 0.85;

    // 1.6 同名多班次的课程：说明需求大，但供给也多
    const sameCourseCount = countSameCourse(course.name);
    if (sameCourseCount > 1) {
        // 需求大但供给多，整体竞争略低
        popularity *= (1 + 0.1 * (sameCourseCount - 1));
    }

    return popularity;
}

// 统计同名课程（不同班次）数量
function countSameCourse(courseName) {
    const baseName = courseName.replace(/-\d+班$/, '').replace(/-[123]班$/, '');
    return courses.filter(c => c.name.startsWith(baseName)).length;
}

// 2. 分析同时段竞争课程
function analyzeTimeSlotCompetition(courseId) {
    const course = courses.find(c => c.id === courseId);
    if (!course || !course.sessions || course.sessions.length === 0) return 1.0;

    // 获取该课程所有时间段的竞争课程
    const competingCourses = new Set();
    course.sessions.forEach(session => {
        courses.forEach(c => {
            if (c.id === courseId) return;
            if (c.sessions.some(s => s.date === session.date && s.time === session.time)) {
                competingCourses.add(c.id);
            }
        });
    });

    // 竞争课程越多，每门课分到的选课人数越少
    // 但热门课仍然会有更高的竞争
    const competitorCount = competingCourses.size;

    // 计算竞争课程的平均热度
    let avgCompetitorPopularity = 0;
    competingCourses.forEach(id => {
        avgCompetitorPopularity += estimateCoursePopularity(id);
    });
    if (competitorCount > 0) {
        avgCompetitorPopularity /= competitorCount;
    }

    // 返回竞争分散系数（0-1之间，越低表示竞争越分散）
    const dispersionFactor = 1 / (1 + competitorCount * 0.15);

    return {
        competitorCount,
        avgCompetitorPopularity,
        dispersionFactor
    };
}

// 3. 估算课程中标概率（给定金币投入）
function estimateWinProbability(courseId, coins, totalCoins = 1000) {
    const popularity = estimateCoursePopularity(courseId);
    const competition = analyzeTimeSlotCompetition(courseId);
    const course = courses.find(c => c.id === courseId);
    const extras = courseExtras[courseId] || {};

    // 课程容量
    const isLimited = extras.notes && extras.notes.includes('限额');
    const capacity = isLimited ? gameTheoryConfig.limitedCapacity : gameTheoryConfig.defaultCapacity;

    // 计算预期需求
    // 基础需求 = 总人数 × 平均选课数 / 课程总数 ≈ 400 × 10 / 70 ≈ 57
    const baseDemand = gameTheoryConfig.totalPlayers * gameTheoryConfig.avgCreditsPerPlayer / gameTheoryConfig.totalCourses;

    // 实际需求 = 基础需求 × 热度 × 竞争分散系数
    // 同时段有多门课时，需求会分散
    const expectedDemand = baseDemand * popularity * competition.dispersionFactor;

    // 供需比：需求/容量
    const demandRatio = expectedDemand / capacity;

    // 场景1: 供大于求（需求 < 容量），几乎稳中
    if (demandRatio <= 0.8) {
        // 需求远小于容量，中标率95%
        return 0.95;
    }

    // 场景2: 供需平衡（需求接近容量）
    if (demandRatio <= 1.2) {
        // 基础中标率 85%，金币影响较小
        const baseProb = 0.85;
        // 平均每门课投入 = 1000 / 10 = 100
        const avgBid = 100;
        // 金币高于平均则提高中标率，低于平均则降低
        const bidBonus = (coins - avgBid) / avgBid * 0.1;
        return Math.min(0.95, Math.max(0.70, baseProb + bidBonus));
    }

    // 场景3: 供不应求（需求 > 容量），竞争激烈
    // 中标率 ≈ 容量/需求 × 金币排名因子
    const baseWinRate = capacity / expectedDemand;

    // 假设其他人的金币分配服从正态分布，均值=100，标准差=30
    const avgBid = 100;
    const bidStdDev = 30;

    // 你的金币在分布中的位置（Z分数）
    const zScore = (coins - avgBid) / bidStdDev;

    // 转换为排名百分位（使用近似的正态CDF）
    // 金币越高，排名越靠前（百分位越高）
    const percentile = 0.5 * (1 + Math.tanh(zScore * 0.8));

    // 中标率 = 基础中标率 × 排名因子
    // 排名前 (capacity/demand) 的人中标
    // 如果你的排名百分位高于 (1 - capacity/demand)，则中标概率高
    const cutoffPercentile = 1 - baseWinRate;

    // 使用Sigmoid平滑过渡
    const rankFactor = 1 / (1 + Math.exp(-5 * (percentile - cutoffPercentile)));

    // 最终中标率
    const finalProb = 0.3 + rankFactor * 0.65;

    return Math.min(0.95, Math.max(0.30, finalProb));
}

// 4. 计算博弈论最优分配（核心算法）
function calculateGameTheoryCoins(strategy = 'balanced') {
    const allSelected = getAllSelectedIds();
    if (allSelected.length === 0) return {};

    // 收集所有选中课程的信息
    const courseInfos = allSelected.map(id => {
        const course = courses.find(c => c.id === id);
        const priority = getCoursesPriority(id);
        if (!course || !priority) return null;

        const popularity = estimateCoursePopularity(id);
        const competition = analyzeTimeSlotCompetition(id);

        return {
            id,
            course,
            priority,
            credits: course.credits,
            popularity,
            competition,
            priorityWeight: priorityWeights[priority]
        };
    }).filter(Boolean);

    if (courseInfos.length === 0) return {};

    // 策略参数
    const strategyParams = {
        conservative: {
            // 保守策略：确保必选课有足够金币，降低风险
            mustMinRatio: 0.25,      // 必选课至少获得25%的金币
            popularityWeight: 0.5,   // 热度影响降低
            priorityBoost: 1.5       // 优先级加成增强
        },
        balanced: {
            // 平衡策略：综合考虑各因素
            mustMinRatio: 0.15,
            popularityWeight: 1.0,
            priorityBoost: 1.2
        },
        aggressive: {
            // 激进策略：重点投入热门课，博取高收益
            mustMinRatio: 0.10,
            popularityWeight: 1.5,
            priorityBoost: 1.0
        }
    };

    const params = strategyParams[strategy] || strategyParams.balanced;

    // 第一步：计算原始权重
    let totalWeight = 0;
    courseInfos.forEach(info => {
        // 基础权重 = 学分 × 优先级权重
        let weight = info.credits * info.priorityWeight * params.priorityBoost;

        // 热度调整
        weight *= Math.pow(info.popularity, params.popularityWeight);

        // 竞争环境调整：竞争越激烈需要投入更多
        weight *= (2 - info.competition.dispersionFactor);

        info.rawWeight = weight;
        totalWeight += weight;
    });

    // 第二步：初步分配
    courseInfos.forEach(info => {
        info.initialCoins = Math.round((info.rawWeight / totalWeight) * 1000);
    });

    // 第三步：保底调整（确保必选课有最低投入）
    const mustCourses = courseInfos.filter(c => c.priority === 'must');
    const mustTotalCoins = mustCourses.reduce((sum, c) => sum + c.initialCoins, 0);
    const mustMinCoins = Math.round(1000 * params.mustMinRatio * mustCourses.length / Math.max(1, courseInfos.length));

    if (mustTotalCoins < mustMinCoins && mustCourses.length > 0) {
        // 需要增加必选课的金币
        const deficit = mustMinCoins - mustTotalCoins;
        const nonMustCourses = courseInfos.filter(c => c.priority !== 'must');
        const nonMustTotal = nonMustCourses.reduce((sum, c) => sum + c.initialCoins, 0);

        if (nonMustTotal > deficit) {
            // 从非必选课中按比例扣除
            const ratio = deficit / nonMustTotal;
            nonMustCourses.forEach(c => {
                c.initialCoins = Math.round(c.initialCoins * (1 - ratio));
            });
            // 增加到必选课
            const perMust = Math.round(deficit / mustCourses.length);
            mustCourses.forEach(c => {
                c.initialCoins += perMust;
            });
        }
    }

    // 第四步：纳什均衡迭代优化
    // 通过多轮迭代调整，使每门课的边际效用接近相等
    for (let iter = 0; iter < 5; iter++) {
        let totalAdjustment = 0;

        courseInfos.forEach(info => {
            // 计算当前分配下的边际效用
            const currentProb = estimateWinProbability(info.id, info.initialCoins, 1000);
            const deltaProbUp = estimateWinProbability(info.id, info.initialCoins + 20, 1000) - currentProb;
            const deltaProbDown = currentProb - estimateWinProbability(info.id, info.initialCoins - 20, 1000);

            // 期望价值 = 概率 × 学分 × 优先级权重
            const value = info.credits * info.priorityWeight;
            info.marginalUtility = deltaProbUp * value / 20; // 每金币的边际效用
            info.currentProb = currentProb;
        });

        // 计算平均边际效用
        const avgMarginalUtility = courseInfos.reduce((sum, c) => sum + c.marginalUtility, 0) / courseInfos.length;

        // 调整分配：将金币从边际效用低的课程转移到边际效用高的课程
        courseInfos.forEach(info => {
            const utilityDiff = info.marginalUtility - avgMarginalUtility;
            const adjustment = Math.round(utilityDiff * 100); // 调整量
            info.initialCoins += adjustment;
            info.initialCoins = Math.max(10, Math.min(500, info.initialCoins));
            totalAdjustment += Math.abs(adjustment);
        });

        // 如果调整量很小，提前结束迭代
        if (totalAdjustment < 10) break;
    }

    // 第五步：归一化确保总和为1000
    let currentTotal = courseInfos.reduce((sum, c) => sum + c.initialCoins, 0);
    if (currentTotal !== 1000 && currentTotal > 0) {
        const ratio = 1000 / currentTotal;
        courseInfos.forEach(c => {
            c.initialCoins = Math.round(c.initialCoins * ratio);
        });
    }

    // 第六步：避开整数陷阱（增强版）
    const trapNumbers = [50, 100, 150, 200, 250, 300, 350, 400, 450, 500];
    const offsets = [3, -3, 7, -7, 13, -13, 17, -17, 23, -23];
    let offsetIdx = 0;

    courseInfos.forEach(info => {
        let coins = info.initialCoins;

        // 避开常见整数陷阱
        if (trapNumbers.includes(coins) || coins % 50 === 0 || coins % 10 === 0) {
            coins += offsets[offsetIdx % offsets.length];
            offsetIdx++;
        }

        // 避开太接近整数的值（如 49, 51, 99, 101）
        const nearestTrap = trapNumbers.find(t => Math.abs(coins - t) <= 2);
        if (nearestTrap) {
            coins = nearestTrap + offsets[offsetIdx % offsets.length];
            offsetIdx++;
        }

        info.finalCoins = Math.max(10, Math.min(500, coins));
    });

    // 最终微调确保总和接近1000
    let finalTotal = courseInfos.reduce((sum, c) => sum + c.finalCoins, 0);
    if (Math.abs(finalTotal - 1000) > 0) {
        // 找到可以微调的课程
        const diff = 1000 - finalTotal;
        const adjustableCourses = courseInfos.filter(c =>
            c.finalCoins + diff >= 10 && c.finalCoins + diff <= 500
        );
        if (adjustableCourses.length > 0) {
            adjustableCourses[0].finalCoins += diff;
        }
    }

    // 构建结果
    const result = {};
    courseInfos.forEach(info => {
        result[info.id] = info.finalCoins;
    });

    return result;
}

// 5. 获取分配详情（用于UI显示）
function getGameTheoryAnalysis() {
    const allSelected = getAllSelectedIds();
    if (allSelected.length === 0) return [];

    return allSelected.map(id => {
        const course = courses.find(c => c.id === id);
        const priority = getCoursesPriority(id);
        if (!course || !priority) return null;

        const popularity = estimateCoursePopularity(id);
        const competition = analyzeTimeSlotCompetition(id);
        const currentCoins = coinAllocations[id] || 0;
        const winProb = estimateWinProbability(id, currentCoins, 1000);

        return {
            id,
            name: course.name,
            priority,
            popularity: popularity.toFixed(2),
            competitorCount: competition.competitorCount,
            currentCoins,
            estimatedWinProb: (winProb * 100).toFixed(1) + '%',
            riskLevel: winProb < 0.4 ? 'high' : winProb < 0.7 ? 'medium' : 'low'
        };
    }).filter(Boolean);
}

// 标签分类规则
const tagRules = {
    finance: ['投融资', '财富', '证券', '银行', '金融', '资本', '保险', '货币', '收益'],
    ai: ['AI', '人工智能', '区块链', '数字', '数据', '科技', '智能', 'Excel'],
    strategy: ['战略', '商业模式', '竞争', '并购', '公司治理', '转型', '创新', '决策'],
    culture: ['历史', '文化', '诸子', '葡萄酒', '宝玉石', '赛艇', '马克思', '哲学', '世界发展'],
    marketing: ['品牌', '消费', '零售', '电商', '营销', '增长'],
    leadership: ['沟通', '团队', '人才', '领导', '管理沟通', '咨询', '项目管理', '危机']
};

function getCourseTag(course) {
    const name = course.name;
    for (const [tag, keywords] of Object.entries(tagRules)) {
        if (keywords.some(kw => name.includes(kw))) return tag;
    }
    return 'other';
}

function matchFilters(course) {
    if (activeFilters.has('all')) return true;
    let matchCategory = false, needCategoryMatch = false;
    for (const filter of activeFilters) {
        if (filter === 'online') { if (!course.is_online) return false; }
        else if (filter === '2credits') { if (course.credits < 2) return false; }
        else { needCategoryMatch = true; if (getCourseTag(course) === filter) matchCategory = true; }
    }
    if (needCategoryMatch && !matchCategory) return false;
    return true;
}

// 导出选课方案（复制文本）
function copyPlanText() {
    // 关闭菜单
    document.getElementById('exportMenu').classList.remove('active');

    const allSelected = getAllSelectedIds();
    if (allSelected.length === 0) {
        showToast('暂无已选课程', 'error');
        return;
    }

    const priorityLabels = {
        must: '📌 必选',
        want: '🔵 想选',
        optional: '⚪ 可选'
    };

    let text = '🎓 MBA选课方案\n\n';
    let totalCredits = 0;
    let totalCoins = 0;

    ['must', 'want', 'optional'].forEach(priority => {
        const ids = selections[priority];
        if (ids.length === 0) return;

        const priorityCourses = ids.map(id => courses.find(c => c.id === id)).filter(Boolean);
        const credits = priorityCourses.reduce((sum, c) => sum + c.credits, 0);
        const coins = ids.reduce((sum, id) => sum + (coinAllocations[id] || 0), 0);

        totalCredits += credits;
        totalCoins += coins;

        text += `${priorityLabels[priority]} (${ids.length}门 / ${credits}学分 / ${coins}金币)\n`;

        priorityCourses.forEach((course, idx) => {
            const isLast = idx === priorityCourses.length - 1;
            const prefix = isLast ? '└─' : '├─';
            const coinAmount = coinAllocations[course.id] || 0;

            // 格式化日期范围
            let dateRange = '';
            if (course.sessions && course.sessions.length > 0) {
                const dates = [...new Set(course.sessions.map(s => s.date))].sort();
                if (dates.length === 1) {
                    dateRange = dates[0].slice(5).replace('-', '/');
                } else if (dates.length === 2) {
                    const d1 = dates[0].slice(5).replace('-', '/');
                    const d2 = dates[1].slice(5).replace('-', '/');
                    // 判断是否连续
                    const date1 = new Date(dates[0]);
                    const date2 = new Date(dates[1]);
                    const diffDays = (date2 - date1) / (1000 * 60 * 60 * 24);
                    if (diffDays === 1) {
                        dateRange = `${d1}-${d2.split('/')[1]}`;
                    } else {
                        dateRange = `${d1}, ${d2}`;
                    }
                } else {
                    dateRange = `${dates[0].slice(5).replace('-', '/')}起${dates.length}天`;
                }
            }

            text += `${prefix} ${course.name}  |  ${dateRange}  |  ${coinAmount}币\n`;
        });

        text += '\n';
    });

    // 统计信息
    text += `📊 统计：共${allSelected.length}门 / ${totalCredits}学分 / ${totalCoins}金币`;

    // 复制到剪贴板
    navigator.clipboard.writeText(text).then(() => {
        showToast('已复制到剪贴板', 'success');
    }).catch(err => {
        // 降级方案：使用 textarea
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.select();
        try {
            document.execCommand('copy');
            showToast('已复制到剪贴板', 'success');
        } catch (e) {
            showToast('复制失败，请手动复制', 'error');
            console.error('复制失败:', e);
        }
        document.body.removeChild(textarea);
    });
}

// ICS 日期格式化
// 输入: date="2026-03-05", time="9:00-12:00"
// 输出: { start: "20260305T090000", end: "20260305T120000" }
function formatICSDate(date, time) {
    // 移除日期中的横线
    const dateStr = date.replace(/-/g, '');

    // 解析时间 "9:00-12:00" 或 "09:00-12:00"
    const [startTime, endTime] = time.split('-');

    function formatTime(t) {
        const [hour, minute] = t.split(':');
        return hour.padStart(2, '0') + minute.padStart(2, '0') + '00';
    }

    return {
        start: dateStr + 'T' + formatTime(startTime),
        end: dateStr + 'T' + formatTime(endTime)
    };
}

// 生成 ICS 文件内容
function generateICS() {
    const allSelected = getAllSelectedIds();
    if (allSelected.length === 0) {
        return null;
    }

    let ics = [
        'BEGIN:VCALENDAR',
        'VERSION:2.0',
        'PRODID:-//MBA选课助手//CN',
        'CALSCALE:GREGORIAN',
        'METHOD:PUBLISH'
    ];

    allSelected.forEach(id => {
        const course = courses.find(c => c.id === id);
        if (!course || !course.sessions) return;

        course.sessions.forEach((session, idx) => {
            const times = formatICSDate(session.date, session.time);
            const location = course.is_online ? '线上课程' : (session.location || '待定');
            const uid = `course-${id}-session-${idx}@mba-picker`;

            ics.push('BEGIN:VEVENT');
            ics.push(`UID:${uid}`);
            ics.push(`DTSTART:${times.start}`);
            ics.push(`DTEND:${times.end}`);
            ics.push(`SUMMARY:${course.name}`);
            ics.push(`LOCATION:${location}`);
            ics.push('END:VEVENT');
        });
    });

    ics.push('END:VCALENDAR');

    return ics.join('\r\n');
}

// 下载 ICS 文件
function downloadICS(content, filename) {
    const blob = new Blob([content], { type: 'text/calendar;charset=utf-8' });
    const url = URL.createObjectURL(blob);

    const link = document.createElement('a');
    link.href = url;
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);

    URL.revokeObjectURL(url);
}

// 导出为 ICS 日历文件
function exportToICS() {
    // 关闭菜单
    document.getElementById('exportMenu').classList.remove('active');

    const allSelected = getAllSelectedIds();
    if (allSelected.length === 0) {
        showToast('请先选择课程', 'error');

    const today = new Date();

    showToast('日历文件已下载', 'success');
}
