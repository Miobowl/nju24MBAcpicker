        balanced: '⚖️ 平衡策略：综合考虑热度、竞争和优先级',
        aggressive: '🎯 激进策略：重点投入热门课，追求高收益'
    };
    const hintEl = document.getElementById('strategyHint');
    if (hintEl) {
        hintEl.innerHTML = hints[gameTheoryConfig.currentStrategy] || hints.balanced;
    }
}

// 显示分配分析结果
function showAllocationAnalysis() {
    const analysis = getGameTheoryAnalysis();
    if (analysis.length === 0) return;

    // 计算总体统计
    let totalProb = 0;
    let highRiskCount = 0;
    analysis.forEach(a => {
        const prob = parseFloat(a.estimatedWinProb);
        totalProb += prob;
        if (a.riskLevel === 'high') highRiskCount++;
    });
    const avgProb = (totalProb / analysis.length).toFixed(1);

    // 构建消息
    let msg = `📊 博弈分析完成\n\n`;
    msg += `平均中标概率: ${avgProb}%\n`;
    if (highRiskCount > 0) {
        msg += `⚠️ ${highRiskCount}门课程风险较高\n\n`;
    }

    // 列出高风险课程
    const highRisk = analysis.filter(a => a.riskLevel === 'high');
    if (highRisk.length > 0) {
        msg += `高风险课程:\n`;
        highRisk.forEach(a => {
            msg += `  • ${a.name.substring(0, 15)}... (${a.estimatedWinProb})\n`;
        });
    }

    showToast(`博弈分析完成，平均中标率 ${avgProb}%`, highRiskCount > 0 ? 'warning' : 'success');
}

function suggestCoins(priority, courseId) {
    const course = courses.find(c => c.id === courseId);
    if (!course) return 50;
    const allSelected = getAllSelectedIds();
    if (allSelected.length === 0) return 50;
    let totalWeighted = 0;
    allSelected.forEach(id => {
        const c = courses.find(x => x.id === id);
        const p = getCoursesPriority(id);
        if (c && p) totalWeighted += c.credits * priorityWeights[p];
    });
    if (totalWeighted === 0) return 50;
    const weight = course.credits * priorityWeights[priority];
    let coins = Math.round((weight / totalWeighted) * 1000);
    if (coins % 50 === 0) coins += 3;
    else if (coins % 10 === 0) coins += 7;
    return Math.max(10, Math.min(500, coins));
}

function init() {
    loadFromLocalStorage();
    renderCourseList();
    renderPriorityLists();
    renderCalendar();
    updateStats();
    setupDragAndDrop();
}

function saveToLocalStorage() {
    localStorage.setItem('mba_selections', JSON.stringify(selections));
    localStorage.setItem('mba_coins', JSON.stringify(coinAllocations));
}

function loadFromLocalStorage() {
    const saved = localStorage.getItem('mba_selections');
    if (saved) selections = JSON.parse(saved);
    const coins = localStorage.getItem('mba_coins');
    if (coins) coinAllocations = JSON.parse(coins);
}

function getAllSelectedIds() {
    return [...selections.must, ...selections.want, ...selections.optional];
}

function getCoursesPriority(id) {
    if (selections.must.includes(id)) return 'must';
    if (selections.want.includes(id)) return 'want';
    if (selections.optional.includes(id)) return 'optional';
    return null;
}

function getConflicts(courseId) {
    const course = courses.find(c => c.id === courseId);
    if (!course) return [];
    const allSelected = getAllSelectedIds();
    const conflicts = [];
    allSelected.forEach(id => {
        if (id === courseId) return;
        const other = courses.find(c => c.id === id);
        if (!other) return;
        for (const s of course.sessions) {
            for (const os of other.sessions) {
                if (s.date === os.date && s.time === os.time) { conflicts.push(other.name); return; }
            }
        }
    });
    return conflicts;
}

function getConflictIds(courseId) {
    const course = courses.find(c => c.id === courseId);
    if (!course) return [];
    const allSelected = getAllSelectedIds();
    const conflictIds = [];
    allSelected.forEach(id => {
        if (id === courseId) return;
        const other = courses.find(c => c.id === id);
        if (!other) return;
        for (const s of course.sessions) {
            for (const os of other.sessions) {
                if (s.date === os.date && s.time === os.time) { conflictIds.push(id); return; }
            }
        }
    });
    return conflictIds;
}

function getConflictDates(courseId) {
    const course = courses.find(c => c.id === courseId);
    if (!course) return [];
    const allSelected = getAllSelectedIds();
    const conflictDates = [];
    allSelected.forEach(id => {
        if (id === courseId) return;
        const other = courses.find(c => c.id === id);
        if (!other) return;
        for (const s of course.sessions) {
            for (const os of other.sessions) {
                if (s.date === os.date && s.time === os.time) conflictDates.push(s.date);
            }
        }
    });
    return conflictDates;
}

function highlightConflicts(courseId) {
    const conflictIds = getConflictIds(courseId);
    const conflictDates = getConflictDates(courseId);
    conflictIds.forEach(id => {
        document.querySelectorAll(`.course-card[data-id="${id}"]`).forEach(card => card.classList.add('conflict-highlight'));
    });
    document.querySelectorAll(`.course-card[data-id="${courseId}"]`).forEach(card => card.classList.add('conflict-source'));
    conflictDates.forEach(date => {
        document.querySelectorAll(`.calendar-day[data-date="${date}"]`).forEach(day => day.classList.add('conflict-highlight'));
    });
}

function clearConflictHighlights() {
    document.querySelectorAll('.conflict-highlight').forEach(el => el.classList.remove('conflict-highlight'));
    document.querySelectorAll('.conflict-source').forEach(el => el.classList.remove('conflict-source'));
}

function updateStats() {
    const allSelected = getAllSelectedIds();
    let credits = 0, conflicts = 0, totalCoins = 0;
    allSelected.forEach(id => {
        const c = courses.find(x => x.id === id);
        if (c) { credits += c.credits; if (getConflicts(id).length > 0) conflicts++; }
        totalCoins += coinAllocations[id] || 0;
    });
    document.getElementById('totalCredits').textContent = credits;
    document.getElementById('selectedCount').textContent = allSelected.length;
    document.getElementById('conflictCount').textContent = conflicts;
    document.getElementById('remainingCoins').textContent = 1000 - totalCoins;
    document.getElementById('conflictStat').classList.toggle('danger', conflicts > 0);
    document.getElementById('coinTotal').textContent = totalCoins;
    document.getElementById('coinSummary').classList.toggle('over', totalCoins > 1000);
    updateNavBadge();
}

function renderCourseList() {
    const container = document.getElementById('courseList');
    const search = document.getElementById('searchInput').value.toLowerCase();
    const month = document.getElementById('monthFilter').value;
    const allSelected = getAllSelectedIds();
    const filtered = courses.filter(c => {
        const matchSearch = c.name.toLowerCase().includes(search);
        const matchMonth = !month || c.start_date.substring(5, 7) === month;
        const notSelected = !allSelected.includes(c.id);
        const matchTag = matchFilters(c);
        return matchSearch && matchMonth && notSelected && matchTag;
    });
    container.innerHTML = filtered.map(c => {
        const dates = [...new Set(c.sessions.map(s => s.date))].map(d => {
            const [,m,day] = d.split('-');
            return `${parseInt(m)}/${parseInt(day)}`;
        }).join(', ');
        const extras = courseExtras[c.id] || {};
        let extrasHtml = '';
        if (reviewUnlocked && (extras.assessment || extras.notes)) {
            extrasHtml = '<div class="course-extras">';
            if (extras.assessment) extrasHtml += '<div class="assessment">' + extras.assessment + '</div>';
            if (extras.notes) extrasHtml += '<div class="notes">' + extras.notes + '</div>';
            extrasHtml += '</div>';
        }
        return '<div class="course-card" draggable="true" data-id="' + c.id + '">' +
            '<div class="name">' +
                '<span>' + c.name + '</span>' +
                '<span>' + (c.is_online ? '<span class="badge online">线上</span>' : '') + (c.credits > 1 ? '<span class="badge credits">' + c.credits + '学分</span>' : '') + '</span>' +
            '</div>' +
            '<div class="info">' + dates + '</div>' +
            extrasHtml +
        '</div>';
    }).join('');
    container.querySelectorAll('.course-card').forEach(card => {
        card.addEventListener('dragstart', handleDragStart);
        card.addEventListener('dragend', handleDragEnd);
        // 移动端点击事件
        card.addEventListener('click', handleCourseCardClick);
    });
}

function renderPriorityLists() {
    ['must', 'want', 'optional'].forEach(priority => {
        const container = document.getElementById(priority + 'List');
        const ids = selections[priority];
        if (ids.length === 0) {
            container.innerHTML = '<div class="empty-hint">拖拽课程至此处</div>';
            return;
        }
        container.innerHTML = ids.map((id, idx) => {
            const c = courses.find(x => x.id === id);
            if (!c) return '';
            const conflicts = getConflicts(id);
            const suggested = suggestCoins(priority, id);
            const coins = coinAllocations[id] || suggested;
            if (!coinAllocations[id]) coinAllocations[id] = coins;
            const dates = [...new Set(c.sessions.map(s => s.date))].map(d => {
                const [,m,day] = d.split('-');
                return `${parseInt(m)}/${parseInt(day)}`;
            }).join(', ');
            const extras = courseExtras[id] || {};
            let extrasHtml = '';
            if (reviewUnlocked && (extras.assessment || extras.notes)) {
                extrasHtml = '<div class="course-extras">';
                if (extras.assessment) extrasHtml += '<div class="assessment">' + extras.assessment + '</div>';
                if (extras.notes) extrasHtml += '<div class="notes">' + extras.notes + '</div>';
                extrasHtml += '</div>';
            }
            // 计算中标概率
            const winProb = estimateWinProbability(id, coins, 1000);
            const probPercent = (winProb * 100).toFixed(0);
            const riskLevel = winProb < 0.4 ? 'high' : winProb < 0.7 ? 'medium' : 'low';
            const riskClass = 'prob-' + riskLevel;
            const popularity = estimateCoursePopularity(id);
            const hotLevel = popularity > 1.3 ? '🔥' : popularity > 1.15 ? '📈' : '';

            return '<div class="course-card" draggable="true" data-id="' + id + '" data-priority="' + priority + '">' +
                '<div class="name">' +
                    '<span>' + c.name + '</span>' +
                    '<button class="remove-btn" onclick="removeCourse(' + id + ', \'' + priority + '\')" title="移除">×</button>' +
                '</div>' +
                '<div class="info">' + dates + ' | ' + c.credits + '学分' + (hotLevel ? ' ' + hotLevel : '') + '</div>' +
                extrasHtml +
                (conflicts.length ? '<div class="conflict-warn">⚠ 冲突: ' + conflicts.join(', ') + '</div>' : '') +
                '<div class="coin-input-wrap">' +
                    '<span>投入</span>' +
                    '<input type="number" value="' + coins + '" min="0" max="1000" onchange="updateCoin(' + id + ', this.value)">' +
                    '<span>枚</span>' +
                    '<span class="win-prob ' + riskClass + '" title="预估中标概率（基于博弈论模型）">中标' + probPercent + '%</span>' +
                '</div>' +
            '</div>';
        }).join('');
        container.querySelectorAll('.course-card').forEach(card => {
            card.addEventListener('dragstart', handleDragStart);
            card.addEventListener('dragend', handleDragEnd);
            card.addEventListener('mouseenter', () => highlightConflicts(parseInt(card.dataset.id)));
            card.addEventListener('mouseleave', clearConflictHighlights);
        });
    });
    updatePriorityHints();
    saveToLocalStorage();
}

function updatePriorityHints() {
    ['must', 'want', 'optional'].forEach(priority => {
        const ids = selections[priority];
        let totalCoins = 0, totalCredits = 0;
        ids.forEach(id => {
            totalCoins += coinAllocations[id] || 0;
            const c = courses.find(x => x.id === id);
            if (c) totalCredits += c.credits;
        });
        const hint = document.getElementById(priority + 'Hint');
        if (hint) {
            if (ids.length === 0) hint.textContent = `×${priorityWeights[priority]}权重`;
            else hint.textContent = `${totalCredits}学分 | ${totalCoins}枚`;
        }
    });
}

function removeCourse(id, priority) {
    selections[priority] = selections[priority].filter(x => x !== id);
    delete coinAllocations[id];
    saveToLocalStorage();
    renderCourseList();
    renderPriorityLists();
    renderCalendar();
    updateStats();
}

function updateCoin(id, value) {
    coinAllocations[id] = parseInt(value) || 0;
    saveToLocalStorage();
    updateStats();
}

let draggedId = null;
let draggedFromPriority = null;

function handleDragStart(e) {
    draggedId = parseInt(e.target.dataset.id);
    draggedFromPriority = e.target.dataset.priority || null;
    e.target.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
}

function handleDragEnd(e) {
    e.target.classList.remove('dragging');
    document.querySelectorAll('.priority-body').forEach(el => el.classList.remove('drag-over'));
}

function setupDragAndDrop() {
    document.querySelectorAll('.priority-body').forEach(zone => {
        zone.addEventListener('dragover', (e) => { e.preventDefault(); zone.classList.add('drag-over'); });
        zone.addEventListener('dragleave', () => { zone.classList.remove('drag-over'); });
        zone.addEventListener('drop', (e) => {
            e.preventDefault();
            zone.classList.remove('drag-over');
            const priority = zone.closest('.priority-col').dataset.priority;
            if (draggedId === null) return;
            if (draggedFromPriority) selections[draggedFromPriority] = selections[draggedFromPriority].filter(x => x !== draggedId);
            if (!selections[priority].includes(draggedId)) {
                selections[priority].push(draggedId);
                if (!coinAllocations[draggedId]) coinAllocations[draggedId] = suggestCoins(priority, draggedId);
            }
            saveToLocalStorage();
            renderCourseList();
            renderPriorityLists();
            renderCalendar();
            updateStats();
            draggedId = null;
            draggedFromPriority = null;
        });
    });
}

function renderCalendar() {
    const container = document.getElementById('calendarScroll');
    const months = [
        { year: 2026, month: 3, name: '2026年3月' },
        { year: 2026, month: 4, name: '2026年4月' },
        { year: 2026, month: 5, name: '2026年5月' },
        { year: 2026, month: 6, name: '2026年6月' },
        { year: 2026, month: 7, name: '2026年7月' },
        { year: 2026, month: 8, name: '2026年8月' }
    ];
    const allEvents = {};
    const allSelected = getAllSelectedIds();
    allSelected.forEach(id => {
        const c = courses.find(x => x.id === id);
        if (!c) return;
        const priority = getCoursesPriority(id);
        c.sessions.forEach(s => {
            if (!allEvents[s.date]) allEvents[s.date] = [];
            allEvents[s.date].push({ name: c.name, time: s.time, id: c.id, priority });
        });
    });
    Object.keys(allEvents).forEach(date => {
        const events = allEvents[date];
        const timeSlots = {};
        events.forEach(e => { if (!timeSlots[e.time]) timeSlots[e.time] = []; timeSlots[e.time].push(e); });
        events.forEach(e => { e.hasConflict = timeSlots[e.time].length > 1; });
    });
    const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
    container.innerHTML = months.map(m => {
        const firstDay = new Date(m.year, m.month - 1, 1);
        const lastDay = new Date(m.year, m.month, 0);
        const startPad = firstDay.getDay();
        let daysHtml = weekdays.map(w => `<div class="calendar-header">周${w}</div>`).join('');
        for (let i = 0; i < startPad; i++) daysHtml += '<div class="calendar-day other-month"></div>';
        for (let day = 1; day <= lastDay.getDate(); day++) {
            const dateStr = `${m.year}-${String(m.month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
            const events = allEvents[dateStr] || [];
            const hasCourse = events.length > 0;
            daysHtml += `<div class="calendar-day ${hasCourse ? 'has-course' : ''}" data-date="${dateStr}">
                <div class="day-number">${day}</div>
                ${events.slice(0, 3).map(e => `<div class="event ${e.hasConflict ? 'conflict' : 'no-conflict'} ${e.priority}" title="${e.name} ${e.time}">${e.name.substring(0, 4)}...</div>`).join('')}
                ${events.length > 3 ? `<div style="font-size:0.6rem;color:var(--ink-500)">+${events.length - 3}</div>` : ''}
            </div>`;
        }
        return `<div class="month-section">
            <div class="month-title">${m.name}</div>
            <div class="calendar-grid">${daysHtml}</div>
        </div>`;
    }).join('');
}

document.getElementById('searchInput').addEventListener('input', renderCourseList);
document.getElementById('monthFilter').addEventListener('change', renderCourseList);

document.getElementById('bottomNav').addEventListener('click', (e) => {
    const navItem = e.target.closest('.bottom-nav-item');
    if (!navItem) return;
    const panelId = navItem.dataset.panel;
    if (!panelId) return;
    document.querySelectorAll('.bottom-nav-item').forEach(item => item.classList.remove('active'));
    navItem.classList.add('active');
    document.querySelectorAll('.panel, .priority-columns').forEach(panel => panel.classList.remove('mobile-active'));
    document.getElementById(panelId).classList.add('mobile-active');
});

function updateNavBadge() {
    const count = getAllSelectedIds().length;
    const badge = document.getElementById('navBadge');
    if (count > 0) { badge.textContent = count; badge.style.display = 'block'; }
    else badge.style.display = 'none';
}

document.getElementById('filterTags').addEventListener('click', (e) => {
    const tag = e.target.dataset.tag;
    if (!tag || e.target.classList.contains('separator')) return;
    if (tag === 'all') { activeFilters.clear(); activeFilters.add('all'); }
    else {
        activeFilters.delete('all');
        if (activeFilters.has(tag)) { activeFilters.delete(tag); if (activeFilters.size === 0) activeFilters.add('all'); }
        else activeFilters.add(tag);
    }
    document.querySelectorAll('.filter-tag').forEach(el => {
        if (el.dataset.tag) el.classList.toggle('active', activeFilters.has(el.dataset.tag));
    });
    renderCourseList();
});

// ═══════════════════════════════════════════════════════════════════
// 移动端Action Sheet功能
// ═══════════════════════════════════════════════════════════════════
let selectedCourseId = null;

function isMobile() {
    return window.innerWidth <= 700;
}

function openActionSheet(courseId) {
    const course = courses.find(c => c.id === courseId);
    if (!course) return;

    selectedCourseId = courseId;

    // 更新弹窗内容
    const courseInfo = document.getElementById('actionSheetCourse');
    const dateRange = course.start_date === course.end_date
        ? course.start_date
        : `${course.start_date} ~ ${course.end_date}`;

    courseInfo.innerHTML = `
        <div class="course-name">${course.name}</div>
        <div class="course-info">
            <span>${course.credits}学分</span>
            <span>${dateRange}</span>
            <span>${course.is_online ? '线上' : '线下'}</span>
        </div>
    `;

    // 显示弹窗
    document.getElementById('actionSheet').classList.add('active');
    document.body.style.overflow = 'hidden';
}

function closeActionSheet() {
    document.getElementById('actionSheet').classList.remove('active');
    document.body.style.overflow = '';
    selectedCourseId = null;
}

function addToPriority(priority) {
    if (selectedCourseId === null) return;

    // 检查是否已经在任何优先级列表中
    const existingPriority = getCoursesPriority(selectedCourseId);
    if (existingPriority) {
        // 如果已存在，先从原列表移除
        selections[existingPriority] = selections[existingPriority].filter(x => x !== selectedCourseId);
    }

    // 添加到新的优先级列表
    if (!selections[priority].includes(selectedCourseId)) {
        selections[priority].push(selectedCourseId);
        if (!coinAllocations[selectedCourseId]) {
            coinAllocations[selectedCourseId] = suggestCoins(priority, selectedCourseId);
        }
    }

    // 关闭弹窗并刷新界面
    closeActionSheet();
    saveToLocalStorage();
    renderCourseList();
    renderPriorityLists();
    renderCalendar();
    updateStats();
}

// 处理课程卡片点击事件（移动端）
function handleCourseCardClick(e) {
    // 只在移动端生效
    if (!isMobile()) return;

    const card = e.target.closest('.course-card');
    if (!card) return;

    // 如果点击的是已选课程，不处理
    if (card.classList.contains('selected')) return;

    // 如果是拖拽操作，不处理
    if (e.target.closest('.course-coins') || e.target.closest('input')) return;

    const courseId = parseInt(card.dataset.id);
    if (courseId) {
        openActionSheet(courseId);
    }
}
